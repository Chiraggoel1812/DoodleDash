services:
  # Backend: persistent Node service (needs WebSocket support -> not serverless)
  - type: web
    name: doodledash-skribbl-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN          # exact frontend origin, e.g. https://doodledash-frontend-fgbs.onrender.com
        sync: false

  # Frontend: static site
  - type: web
    name: doodledash-frontend
    runtime: static
    buildCommand: cd client && npm install --include=dev && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL        # public URL of the backend service above
        sync: false
